<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picker tests</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
    .pass { color: #0a7a3a; } .fail { color: #b00020; font-weight: bold; }
    #summary { font-size: 1.3rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Picker tests</h1>
  <p id="summary">Running…</p>
  <ul id="results"></ul>
  <script type="module">
    import { pick, poolFor, fillerStrip, seededRandom, excludedTags } from "../js/picker.js";

    // ?deck=microbit tests the micro:bit sub-site's deck instead of the main one.
    const site = new URLSearchParams(location.search).get("deck");
    const base = site ? `../${site}/` : "../";
    document.querySelector("h1").textContent += site ? ` (${site})` : " (main)";
    const data = await fetch(`${base}data/ingredients.json`).then((r) => r.json());
    const { ingredients: deck, wheels } = data;
    const options = data.options ?? [];
    const results = [];
    const test = async (name, fn) => {
      try { await fn(); results.push([name, true]); }
      catch (e) { results.push([name, false, e.message]); }
    };
    const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
    const ids = (combo) => wheels.map((w) => combo[w.id].id);
    const everything = { excludeTags: [] };
    const tagged = (tag) => deck.filter((i) => (i.tags ?? []).includes(tag));

    await test("every ingredient has a known wheel and a valid id", () => {
      const wheelIds = new Set(wheels.map((w) => w.id));
      for (const i of deck) {
        assert(wheelIds.has(i.wheel), `${i.id} has unknown wheel ${i.wheel}`);
        assert(/^[a-z0-9-]+$/.test(i.id), `${i.id} is not a valid file name`);
      }
      assert(new Set(deck.map((i) => i.id)).size === deck.length, "duplicate ids");
    });

    await test("every picture file exists", async () => {
      const missing = [];
      for (const i of deck) {
        for (const src of i.layers ?? [i.image ?? `img/ingredients/${i.id}.svg`]) {
          const res = await fetch(base + src, { method: "HEAD" });
          if (!res.ok) missing.push(`${i.id}: ${src}`);
        }
      }
      assert(!missing.length, missing.join(", "));
    });

    await test("each wheel's item comes from that wheel", () => {
      const rnd = seededRandom(1);
      for (let n = 0; n < 500; n++) {
        const combo = pick(deck, wheels, new Set(), {}, everything, rnd);
        for (const w of wheels) assert(combo[w.id].wheel === w.id, `${combo[w.id].id} on ${w.id}`);
      }
    });

    await test("no item appears twice in one combination", () => {
      const rnd = seededRandom(2);
      for (let n = 0; n < 500; n++) {
        const combo = pick(deck, wheels, new Set(), {}, everything, rnd);
        assert(new Set(ids(combo)).size === wheels.length, ids(combo).join());
      }
    });

    for (const opt of options) {
      await test(`option "${opt.label}": its items only appear when they should`, () => {
        assert(tagged(opt.tag).length, `no items tagged ${opt.tag}`);
        for (const on of [false, true]) {
          const filter = { excludeTags: excludedTags(options, { [opt.id]: on }) };
          const shouldShow = opt.hides ? !on : on;
          const rnd = seededRandom(on ? 3 : 4);
          let seen = 0;
          for (let n = 0; n < 1000; n++) {
            const combo = pick(deck, wheels, new Set(), {}, filter, rnd);
            seen += wheels.filter((w) => (combo[w.id].tags ?? []).includes(opt.tag)).length;
          }
          assert(shouldShow ? seen > 0 : seen === 0, `${opt.id}=${on}: saw ${seen} "${opt.tag}" items`);
        }
      });
    }

    await test("the default settings leave every wheel with at least 3 items", () => {
      const filter = { excludeTags: excludedTags(options, {}) };
      for (const w of wheels) {
        const n = poolFor(deck, w.id, filter).length;
        assert(n >= 3, `${w.id} has only ${n}`);
      }
    });

    await test("locked wheels never change", () => {
      const rnd = seededRandom(5);
      let combo = pick(deck, wheels, new Set(), {}, everything, rnd);
      const lockedIds = [wheels[0].id, wheels.at(-1).id];
      for (let n = 0; n < 300; n++) {
        const next = pick(deck, wheels, new Set(lockedIds), combo, everything, rnd);
        for (const id of lockedIds) assert(next[id] === combo[id], `locked ${id} changed`);
        combo = next;
      }
    });

    await test("unlocked wheels always change on a re-spin", () => {
      const rnd = seededRandom(6);
      const lockedId = wheels[1].id;
      let combo = pick(deck, wheels, new Set(), {}, everything, rnd);
      for (let n = 0; n < 500; n++) {
        const next = pick(deck, wheels, new Set([lockedId]), combo, everything, rnd);
        for (const w of wheels) {
          if (w.id !== lockedId) assert(next[w.id].id !== combo[w.id].id, `${w.id} repeated`);
        }
        combo = next;
      }
    });

    await test("items come up roughly evenly over 1,000 spins", () => {
      const counts = {};
      const rnd = seededRandom(7);
      for (let n = 0; n < 1000; n++) {
        const combo = pick(deck, wheels, new Set(), {}, everything, rnd);
        for (const w of wheels) counts[combo[w.id].id] = (counts[combo[w.id].id] ?? 0) + 1;
      }
      for (const w of wheels) {
        const pool = poolFor(deck, w.id, everything);
        const expected = 1000 / pool.length;
        for (const item of pool) {
          const c = counts[item.id] ?? 0;
          assert(c > expected * 0.6 && c < expected * 1.4, `${item.id}: ${c} vs ~${expected.toFixed(0)}`);
        }
      }
    });

    await test("filler strip never repeats back-to-back", () => {
      const strip = fillerStrip(poolFor(deck, wheels[0].id, everything), 200, seededRandom(8));
      for (let i = 1; i < strip.length; i++) assert(strip[i] !== strip[i - 1], `repeat at ${i}`);
    });

    const failed = results.filter((r) => !r[1]).length;
    document.getElementById("summary").textContent =
      failed ? `${failed} of ${results.length} failed` : `All ${results.length} tests passed`;
    document.getElementById("summary").className = failed ? "fail" : "pass";
    document.getElementById("results").innerHTML = results
      .map(([name, ok, msg]) => `<li class="${ok ? "pass" : "fail"}">${ok ? "✓" : "✗"} ${name}${msg ? ` — ${msg}` : ""}</li>`)
      .join("");
  </script>
</body>
</html>
